version: '3.8'

services:
  academic-assistant:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: academic_assistant_app
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - SECRET_KEY=production-secret-key-replace-with-random-hash
      - DATABASE_URL=sqlite:///./data/academic_assistant.db
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - UPLOAD_DIR=./data/uploads
      - EXPORT_DIR=./data/exports
    volumes:
      - academic_data:/app/data

volumes:
  academic_data:
    driver: local
